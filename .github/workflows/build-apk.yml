name: Build RAMA77 Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Uploaded ZIP File
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE. Extracting..."
            unzip -o "$ZIP_FILE" -d temp_extract
            
            if [ -f "temp_extract/build.gradle.kts" ] || [ -f "temp_extract/build.gradle" ]; then
              cp -rn temp_extract/* .
            else
              SUB_DIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ -n "$SUB_DIR" ]; then
                cp -rn $SUB_DIR/* .
              fi
            fi
            rm -rf temp_extract
          fi

      - name: Make Gradle Executable
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAMA77-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
